<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FindYou · 连接观察台</title><style>
:root{font:14px/1.6 "Segoe UI","Microsoft YaHei UI",sans-serif;color:#35314b;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e9e7f1;padding:22px max(24px,calc((100% - 1160px)/2));display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}header b span{color:#7463d6}header small{color:#a299b6}main{max-width:1208px;margin:40px auto;padding:0 24px}h1{font-size:29px;font-weight:650;margin:0}p{color:#a29aae;font-size:12px;margin:8px 0 28px}.live{color:#409c7f;background:#edf7f2;border-radius:20px;padding:5px 12px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:25px 0}.stat{background:#fff;border:1px solid #e9e7f1;padding:22px;border-radius:14px}.stat small{color:#a299b4;font-size:11px}.stat strong{display:block;font-size:32px;font-weight:550;margin-top:10px;color:#6c5cbd}.stat em{display:block;color:#b5afc1;font-size:10px;font-style:normal}.panel{border:1px solid #e9e7f1;background:#fff;border-radius:14px;padding:22px 24px;margin-top:22px;overflow:auto}h2{font-size:15px;font-weight:600;margin:0 0 18px}.panel-title{display:flex;justify-content:space-between}.panel-title small{color:#aca4ba;font-size:10px}table{border-collapse:collapse;width:100%;white-space:nowrap}th{font-size:10px;color:#b2a9c1;font-weight:500;text-align:left;background:#faf9fc;padding:10px 13px}td{font-size:12px;padding:15px 13px;border-bottom:1px solid #f3f1f7}tr:last-child td{border:0}.tag{color:#49987d;background:#f0f8f3;border-radius:6px;padding:3px 8px;font-size:10px}.tag.fail{color:#c36e79;background:#fceff2}.empty{color:#b4adbf;padding:32px;text-align:center}.log{display:flex;align-items:baseline;gap:20px;padding:9px 0;border-bottom:1px solid #f6f4f9;font-size:11px}.log time{color:#b7afc1;min-width:72px}.log span{color:#9b8cac;min-width:60px}.log.fail span{color:#c87885}#logs{max-height:320px;overflow:auto}footer{display:flex;justify-content:space-between;font-size:10px;color:#aaa1b8;margin-top:24px}.error{color:#bf6874}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}main{margin:25px auto}.stat{padding:15px}header small{display:none}.panel{padding:18px}footer{flex-direction:column;gap:6px}}</style></head><body>
<header><b><span>⇄</span> FindYou <small>/ 连接观察台</small></b><span id="health" class="live">正在连接</span></header>
<main><h1>每一次连接，都看得见。</h1><p>这里只交换发现与连接信令。文件留在设备之间，通过 HTTP 或 P2P 直接传输。</p>
<div class="stats"><div class="stat"><small>在线设备</small><strong id="online">—</strong><em>当前保持发现连接的设备</em></div><div class="stat"><small>连接成功上报</small><strong id="success">—</strong><em>按设备计数，双方分别上报</em></div><div class="stat"><small>连接失败上报</small><strong id="failed">—</strong><em>直连未能建立或连接中断</em></div><div class="stat"><small>服务器文件流量</small><strong>0 B</strong><em>文件中继入口已禁用</em></div></div>
<section class="panel"><div class="panel-title"><h2>在线设备</h2><small>连接状态来自客户端上报</small></div><table><thead><tr><th>设备名称</th><th>发现分组</th><th>设备地址</th><th>连接状态</th><th>信令数量</th><th>上线时间</th></tr></thead><tbody id="devices"></tbody></table></section>
<section class="panel"><div class="panel-title"><h2>连接事件</h2><small>最近 200 条 · 自动更新</small></div><div id="logs"></div></section>
<footer><span id="totals">正在读取信令统计…</span><span>FindYou 5 · Discovery & Signalling Only</span></footer></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types={online:'设备上线',offline:'设备离线',connected:'连接成功','http-connected':'HTTP 已连接',connecting:'正在连接',failed:'连接失败',disconnected:'连接结束',blocked:'中继已拒绝'};
async function update(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();document.querySelector('#online').textContent=d.devices.length;document.querySelector('#success').textContent=d.stats.connected;document.querySelector('#failed').textContent=d.stats.failed;document.querySelector('#health').textContent='● 服务运行中';document.querySelector('#health').className='live';document.querySelector('#devices').innerHTML=d.devices.length?d.devices.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.group)+'</td><td>'+esc(c.address)+':'+esc(c.port)+'</td><td><span class="tag '+(c.status.includes('失败')?'fail':'')+'">'+esc(c.status)+'</span></td><td>'+c.signals+'</td><td>'+new Date(c.since).toLocaleTimeString()+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">等待设备上线。在 FindYou 的连接设置中填写此服务器地址即可。</td></tr>';document.querySelector('#logs').innerHTML=d.logs.length?d.logs.map(e=>'<div class="log '+(e.type==='failed'?'fail':'')+'"><time>'+new Date(e.time).toLocaleTimeString()+'</time><span>'+esc(types[e.type]||e.type)+'</span><div>'+esc(e.text)+'</div></div>').join(''):'<div class="empty">连接事件将在这里出现</div>';document.querySelector('#totals').textContent='累计发现连接 '+d.stats.connections+' · 转发信令 '+d.stats.signals+' 条 · 信令流量 '+(d.stats.signalBytes/1024).toFixed(1)+' KB';}catch{document.querySelector('#health').textContent='服务连接中断，正在重试';document.querySelector('#health').className='error';}setTimeout(update,3000);}update();
</script></body></html>
